name: Release to Maven Central

permissions: {}

on:
  workflow_dispatch:
    inputs:
      ref_to_release:
        description: 'Branch or commit to release. Default: repo default branch'
        required: false
        type: string
        default: ''

jobs:
  call-release-job:
    permissions:
      contents: write # needed to push commit and tag back to the repository
    uses: project-ncl/shared-github-actions/.github/workflows/gradle-release.yml@461b242bf215856b94e7b40f1ecfa06f7ebb1b45 # v0.0.26
    with:
      additional_release_args: "-Prelease.useAutomaticVersion=true"
      ref_to_release: ${{ inputs.ref_to_release }}
    secrets:
      SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
      SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
