// Dependency versions — single source of truth.
// This file is applied from the root build.gradle.kts so that:
//   1. Dependabot fetches and parses it (filename contains "dependencies",
//      and ext { key = "value" } matches its GROOVY_SINGLE_PROPERTY_DECLARATION_REGEX).
//   2. All subprojects inherit the properties via Gradle's ext mechanism.
//
// IMPORTANT: Dependabot resolves dependencies that appear as full "group:artifact:version"
// coordinate strings directly in this file (picocli pattern). The version variables below
// are the single update point; the coordinate strings are what Dependabot actually tracks.
// See: https://github.com/remkop/picocli/blob/main/dependencies.gradle
ext {
    assertjVersion          = "3.27.7"
    atlasVersion            = "1.2.2"
    bytemanVersion          = "4.0.26"
    commonsBeanVersion      = "1.11.0"
    commonsIOVersion        = "2.22.0"
    commonsLangVersion      = "3.20.0"
    // Used in the CLI. Only limited version range available in repo.gradle.org/ui/native/libs-releases-local
    gradleVersion           = "5.6.4"
    groovyVersion           = "3.0.25"
    ivyVersion              = "2.6.0"
    // Must use 6.x series as 7.x and above require JDK17
    jgitVersion             = "6.10.1.202505221210-r"
    junitVersion            = "4.13.2"
    // CLI targets JDK11, so 1.6.x is fine (1.4.x+ requires JDK11).
    logbackVersion          = "1.6.3"
    mavenVersion            = "3.9.15"
    mockitoVersion          = "5.23.0"
    opentelemetryVersion    = "2.1.0"
    ownerVersion            = "1.0.12"
    picocliVersion          = "4.7.7"
    plexusArchiverVersion   = "4.14.0"
    pmeVersion              = "5.8"
    slf4jVersion            = "2.0.18"
    systemStubsVersion      = "2.1.8"
    // wiremock-jre8 is intentionally pinned at 2.35.2 and ignored by Dependabot (see .github/dependabot.yml).
    // Upgrading to 3.x breaks Gradle 4.10–5.2 compatibility: WireMock 3.x requires Jetty 11 and the
    // TargetJvmVersion attribute API to resolve Java 11 variants, which is unavailable in Gradle < 5.3.
    // WireMock 2.x uses Jetty 9.4.x (EOL), but it is test-only and never included in any published artifact.
    // Long-term fix: replace WireMock with OkHttp MockWebServer (~30 functional test classes to rewrite).
    wiremockVersion         = "2.35.2"

    // Full coordinate strings — Dependabot reads these directly from this file
    // and updates the version variable above when a new release is available.
    assertjCore             = "org.assertj:assertj-core:$assertjVersion"
    atlasIdentities         = "org.commonjava.atlas:atlas-identities:$atlasVersion"
    bytemanBmunit           = "org.jboss.byteman:byteman-bmunit:$bytemanVersion"
    commonsBeanutils        = "commons-beanutils:commons-beanutils:$commonsBeanVersion"
    commonsIO               = "commons-io:commons-io:$commonsIOVersion"
    commonsLang3            = "org.apache.commons:commons-lang3:$commonsLangVersion"
    gradleCoreApi           = "org.gradle:gradle-core-api:$gradleVersion"
    gradleBaseServices      = "org.gradle:gradle-base-services:$gradleVersion"
    gradleToolingApi        = "org.gradle:gradle-tooling-api:$gradleVersion"
    groovy                  = "org.codehaus.groovy:groovy:$groovyVersion"
    ivy                     = "org.apache.ivy:ivy:$ivyVersion"
    jgit                    = "org.eclipse.jgit:org.eclipse.jgit:$jgitVersion"
    junit                   = "junit:junit:$junitVersion"
    logbackClassic          = "ch.qos.logback:logback-classic:$logbackVersion"
    logbackCore             = "ch.qos.logback:logback-core:$logbackVersion"
    mavenArtifact           = "org.apache.maven:maven-artifact:$mavenVersion"
    mavenCompat             = "org.apache.maven:maven-compat:$mavenVersion"
    mavenCore               = "org.apache.maven:maven-core:$mavenVersion"
    mavenModel              = "org.apache.maven:maven-model:$mavenVersion"
    mavenSettings           = "org.apache.maven:maven-settings:$mavenVersion"
    mavenSettingsBuilder    = "org.apache.maven:maven-settings-builder:$mavenVersion"
    mockitoCore             = "org.mockito:mockito-core:$mockitoVersion"
    opentelemetryExtCli     = "org.jboss.pnc.otel:opentelemetry-ext-cli-java:$opentelemetryVersion"
    ownerJava8              = "org.aeonbits.owner:owner-java8:$ownerVersion"
    picocli                 = "info.picocli:picocli:$picocliVersion"
    plexusArchiver          = "org.codehaus.plexus:plexus-archiver:$plexusArchiverVersion"
    pmeCommonLite           = "org.jboss.pnc.maven-manipulator:pom-manipulation-common-lite:$pmeVersion"
    pmeCommon               = "org.jboss.pnc.maven-manipulator:pom-manipulation-common:$pmeVersion"
    pmeCore                 = "org.jboss.pnc.maven-manipulator:pom-manipulation-core:$pmeVersion"
    pmeIO                   = "org.jboss.pnc.maven-manipulator:pom-manipulation-io:$pmeVersion"
    slf4jApi                = "org.slf4j:slf4j-api:$slf4jVersion"
    systemStubsJunit4       = "uk.org.webcompere:system-stubs-junit4:$systemStubsVersion"
    wiremockJre8            = "com.github.tomakehurst:wiremock-jre8:$wiremockVersion"
    // JUnitParams is abandoned (last release 2017) — pinned permanently, not managed by Dependabot
    junitParams             = "pl.pragmatists:JUnitParams:1.1.1"
}
