# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
version: 2
updates:
  #
  # Uncomment the appropriate ecosystem for each repository
  #
  - package-ecosystem: "gradle"
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    # wait after a new release till we create a PR, to reduce risk of pulling
    # a compromised new version
    cooldown:
      default-days: 7
      # Exclude our own repos from cooldown
      # https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference#cooldown-
      exclude:
        - "org.jboss.da:*"
        - "org.jboss.pnc*:*"        # match org.jboss.pnc:xyz and org.jboss.pnc.group:xyz
        - "org.commonjava*:*"       # match org.commonjava:xyz and org.commonjava.group:xyz
    # Frozen branches use string concatenation in build.gradle.kts to hide their version
    # literals from Dependabot's static parser (VALUE_REGEX requires a single quoted token).
    # Only the active/highest-Gradle branch of each plugin uses a plain literal and receives
    # updates. No ignore rules are needed for frozen branches as Dependabot cannot see them.
    ignore:
      # wiremock-jre8 is pinned at 2.35.2 (test-only, never shipped in any artifact).
      # Upgrading to 3.x was attempted in commit 50c081cb but reverted because:
      #   - wiremock-jre8 3.x depends on Jetty 11, which requires Java 11 variant resolution.
      #     The TargetJvmVersion attribute API used to express this is not available in
      #     Gradle < 5.3, breaking builds on the Gradle 4.10–5.2 compatibility matrix.
      #   - Jetty 9.4.x (used by 2.x) is EOL; the remaining CVEs in both 9.4.49 and the
      #     latest 9.4.58 are unfixable within the 9.4 branch regardless of the patch version.
      #   - WireMock is test-only infrastructure that is never included in any published
      #     artifact, so the CVE exposure is limited to CI runners only.
      # The correct long-term fix is to replace WireMock entirely (e.g. OkHttp MockWebServer),
      # but that requires rewriting ~30 functional test classes and is out of scope here.
      - dependency-name: "com.github.tomakehurst:wiremock-jre8"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
